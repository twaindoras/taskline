<body>

<div class="rail"></div>

<header class="topbar">
  <div class="wordmark"><span class="dot"></span>Taskline</div>
  <div id="authArea" class="auth-area">
    <button class="btn-ghost" id="signInBtn">Sign in</button>
    <button class="btn-primary" id="signUpBtn">Create account</button>
  </div>
  <div id="userArea" class="auth-area" style="display:none">
    <span class="user-email" id="userEmail"></span>
    <button class="btn-ghost" id="signOutBtn">Sign out</button>
  </div>
</header>

<main class="wrap">

  <section id="signedOut" class="empty-state">
    <h1>A line through your day.</h1>
    <p>Taskline is a small, real task manager — sign in to create tasks, set priorities and due dates, and track what's overdue.</p>
    <button class="btn-primary btn-large" id="ctaSignUp">Create a free account</button>
    <p class="fine-print">Or <a href="https://github.com/YOUR_USERNAME/taskline" target="_blank">view the source on GitHub</a>.</p>
  </section>

  <section id="signedIn" class="board" style="display:none">
    <div class="summary-row" id="summaryRow"></div>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskTitle" placeholder="What needs doing?" required maxlength="200"/>
      <input type="text" id="taskCategory" placeholder="Category (optional)" maxlength="40" list="categoryList"/>
      <datalist id="categoryList"></datalist>
      <select id="taskPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="taskDue"/>
      <button type="submit" class="btn-primary">Add task</button>
    </form>

    <div class="filter-row">
      <div class="seg" id="statusFilter">
        <button class="seg-btn active" data-value="all">All</button>
        <button class="seg-btn" data-value="active">Active</button>
        <button class="seg-btn" data-value="done">Done</button>
      </div>
      <select id="categoryFilter" class="cat-filter">
        <option value="all">All categories</option>
      </select>
    </div>

    <ul id="taskList" class="task-list"></ul>
    <p id="emptyMsg" class="empty-msg" style="display:none">No tasks match this view yet.</p>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="task-utils.js"></script>
<script src="app.js"></script>
</body>
</html>
